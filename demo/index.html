<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
    <title>Glass Card</title>
    <meta name="description" content="Tinted, frosted glass cards that blur whatever is behind them. One CSS file, plus an optional React component." />
  </head>
  <body>
    <div id="app"></div>

    <section class="vanilla" aria-labelledby="vanilla-title">
      <header class="intro">
        <h2 id="vanilla-title">No React</h2>
        <p>Same CSS, plain HTML. <code>&lt;div class="glass-card" data-swatch="mint"&gt;</code></p>
      </header>
      <div class="stage stage--small">
        <div class="stage-center">
          <div class="scene scene--small" aria-hidden="true">
            <div class="layer layer--violet"></div>
            <div class="layer layer--lemon"></div>
          </div>
          <div class="glass-card demo-card demo-card--compact" data-swatch="mint">
            <span class="card-subtitle">This afternoon</span>
            <span class="card-title">A little fresh air</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="foot">
      <a href="https://github.com/alexko0421/glass-card-web">GitHub</a>
      <span aria-hidden="true">·</span>
      <span>MIT</span>
      <span aria-hidden="true">·</span>
      <span>Also available for <a href="https://github.com/alexko0421/glass-card">SwiftUI</a></span>
    </footer>

    <script type="module" src="./main.tsx"></script>
  </body>
</html>
